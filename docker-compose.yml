version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeon-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Supabase Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # Database
      - DATABASE_URL=${DATABASE_URL}

      # Application
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - aeon-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.aeon.service=app"
      - "com.aeon.version=1.0.0"

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: aeon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - aeon-network
    labels:
      - "com.aeon.service=nginx"
    profiles:
      - with-nginx

networks:
  aeon-network:
    driver: bridge
    name: aeon-network

# Volumes for persistent data (if needed)
volumes:
  app-data:
    driver: local
