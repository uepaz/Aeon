version: '3.8'

services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeon-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - aeon-network
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - default
      - with-minio

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: aeon-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - aeon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - with-minio

  # MinIO 初始化（自动创建桶）
  minio-init:
    image: minio/mc:latest
    container_name: aeon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - aeon-network
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb minio/${NEXT_PUBLIC_MINIO_BUCKET:-aeon-photos} --ignore-existing;
      mc anonymous set download minio/${NEXT_PUBLIC_MINIO_BUCKET:-aeon-photos};
      exit 0;
      "
    profiles:
      - with-minio

networks:
  aeon-network:
    driver: bridge

volumes:
  minio-data:
    driver: local
